<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>轻量 AI 对话</title>
  <link id="highlightTheme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f5;
      --panel: #ffffff;
      --panel-soft: #f0f1ee;
      --text: #20231f;
      --muted: #6f766c;
      --line: #dcded8;
      --accent: #256f5b;
      --accent-dark: #1e5c4b;
      --accent-text: #ffffff;
      --danger: #b42318;
      --shadow: 0 16px 50px rgba(30, 35, 28, 0.08);
      --control-bg: #ffffff;
      --control-hover-bg: #fafbf9;
      --control-hover-border: #b9beb5;
      --sidebar-bg: #f1f2ef;
      --history-hover-bg: #e8ebe6;
      --history-active-bg: #e2eee9;
      --history-active-border: #b7d8cd;
      --topbar-bg: rgba(255, 255, 255, 0.86);
      --composer-wrap-bg: rgba(255, 255, 255, 0.9);
      --input-bg: #ffffff;
      --focus-ring: rgba(37, 111, 91, 0.12);
      --drag-ring: rgba(37, 111, 91, 0.14);
      --assistant-dot: #5969a5;
      --user-message-bg: #e9f3ef;
      --user-message-border: #c4ddd4;
      --error-message-bg: #fff5f3;
      --error-message-border: #f0b8b2;
      --error-message-text: #7a251d;
      --message-action-bg: rgba(255, 255, 255, 0.82);
      --code-bg: #f6f8fa;
      --code-border: #dde2dc;
      --inline-code-bg: #edf0ec;
      --quote-border: #bdc6bb;
      --quote-text: #4e584c;
      --image-bg: #ffffff;
      --mobile-sidebar-shadow: 20px 0 50px rgba(32, 35, 31, 0.16);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #171a21;
        --panel-soft: #20242c;
        --text: #e8ecf1;
        --muted: #9aa4b2;
        --line: #2b313a;
        --accent: #4fc3a1;
        --accent-dark: #36a685;
        --accent-text: #06120f;
        --danger: #ff6b5f;
        --shadow: 0 18px 55px rgba(0, 0, 0, 0.42);
        --control-bg: #1a1e25;
        --control-hover-bg: #232832;
        --control-hover-border: #3b4654;
        --sidebar-bg: #141820;
        --history-hover-bg: #202631;
        --history-active-bg: #17362f;
        --history-active-border: #2f7e67;
        --topbar-bg: rgba(19, 22, 29, 0.9);
        --composer-wrap-bg: rgba(19, 22, 29, 0.92);
        --input-bg: #11141a;
        --focus-ring: rgba(79, 195, 161, 0.2);
        --drag-ring: rgba(79, 195, 161, 0.24);
        --assistant-dot: #8ea2ff;
        --user-message-bg: #12362e;
        --user-message-border: #2b8069;
        --error-message-bg: #351818;
        --error-message-border: #7d2f2a;
        --error-message-text: #ffb4ad;
        --message-action-bg: rgba(26, 30, 37, 0.9);
        --code-bg: #0d1117;
        --code-border: #30363d;
        --inline-code-bg: #242a32;
        --quote-border: #52606f;
        --quote-text: #c3cbd6;
        --image-bg: #11141a;
        --mobile-sidebar-shadow: 20px 0 55px rgba(0, 0, 0, 0.44);
      }
    }

    html[data-theme="light"] {
      color-scheme: light;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a21;
      --panel-soft: #20242c;
      --text: #e8ecf1;
      --muted: #9aa4b2;
      --line: #2b313a;
      --accent: #4fc3a1;
      --accent-dark: #36a685;
      --accent-text: #06120f;
      --danger: #ff6b5f;
      --shadow: 0 18px 55px rgba(0, 0, 0, 0.42);
      --control-bg: #1a1e25;
      --control-hover-bg: #232832;
      --control-hover-border: #3b4654;
      --sidebar-bg: #141820;
      --history-hover-bg: #202631;
      --history-active-bg: #17362f;
      --history-active-border: #2f7e67;
      --topbar-bg: rgba(19, 22, 29, 0.9);
      --composer-wrap-bg: rgba(19, 22, 29, 0.92);
      --input-bg: #11141a;
      --focus-ring: rgba(79, 195, 161, 0.2);
      --drag-ring: rgba(79, 195, 161, 0.24);
      --assistant-dot: #8ea2ff;
      --user-message-bg: #12362e;
      --user-message-border: #2b8069;
      --error-message-bg: #351818;
      --error-message-border: #7d2f2a;
      --error-message-text: #ffb4ad;
      --message-action-bg: rgba(26, 30, 37, 0.9);
      --code-bg: #0d1117;
      --code-border: #30363d;
      --inline-code-bg: #242a32;
      --quote-border: #52606f;
      --quote-text: #c3cbd6;
      --image-bg: #11141a;
      --mobile-sidebar-shadow: 20px 0 55px rgba(0, 0, 0, 0.44);
    }

    * {
      box-sizing: border-box;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: var(--control-bg);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    button:hover {
      border-color: var(--control-hover-border);
      background: var(--control-hover-bg);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    button.danger {
      color: var(--danger);
    }

    button.danger:hover {
      border-color: var(--danger);
      background: var(--error-message-bg);
      color: var(--danger);
    }

    .app {
      display: grid;
      grid-template-columns: 286px minmax(0, 1fr);
      height: 100vh;
      min-height: 0;
    }

    .app.sidebar-collapsed {
      grid-template-columns: 0 minmax(0, 1fr);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: var(--sidebar-bg);
      transition: opacity 0.16s ease;
    }

    .sidebar-collapsed .sidebar {
      opacity: 0;
      pointer-events: none;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .new-chat {
      flex: 1;
      height: 38px;
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .new-chat:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    .icon-button {
      width: 38px;
      height: 38px;
      display: inline-grid;
      place-items: center;
      padding: 0;
      flex: 0 0 auto;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .history-empty {
      padding: 18px 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .history-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
      padding: 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
    }

    .history-item:hover {
      background: var(--history-hover-bg);
    }

    .history-item.active {
      background: var(--history-active-bg);
      border-color: var(--history-active-border);
    }

    .history-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 600;
    }

    .history-time {
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }

    .history-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .confirm-delete {
      max-width: 0;
      height: 26px;
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 6px;
      background: var(--danger);
      color: #fff;
      font-size: 12px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .confirm-delete:hover {
      border-color: transparent;
      background: var(--danger);
      color: #fff;
    }

    .history-actions.show-confirm .confirm-delete {
      max-width: 60px;
      opacity: 1;
      padding: 0 10px;
      margin-right: 4px;
    }

    .delete-chat {
      width: 32px;
      height: 32px;
      padding: 0;
      color: var(--danger);
      opacity: 0.78;
    }

    .main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
      background: var(--bg);
    }

    .topbar {
      position: relative;
      z-index: 30;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--topbar-bg);
      backdrop-filter: blur(10px);
    }

    .title-block {
      min-width: 0;
    }

    .app-title {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
      font-weight: 700;
    }

    .status {
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }

    .config-toggle {
      height: 38px;
      padding: 0 14px;
      white-space: nowrap;
    }

    .theme-toggle {
      height: 38px;
      padding: 0 12px;
      white-space: nowrap;
    }

    .config {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px 12px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      padding: 16px 18px 120px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--topbar-bg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .config.open {
      display: grid;
    }

    .field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
    }

    .field input,
    .field select {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
    }

    .model-manager {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-start;
      margin-top: 4px;
    }

    .model-control {
      display: flex;
      gap: 8px;
      min-width: 0;
    }

    .model-control input {
      width: 180px;
    }

    .model-control select {
      width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-tags-display {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .model-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 12px;
    }

    .model-badge.is-default {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-text);
      font-weight: bold;
    }

    .secret-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 58px;
      gap: 8px;
    }

    .secret-toggle {
      height: 38px;
      padding: 0 10px;
      white-space: nowrap;
      font-size: 13px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field.new-row {
      grid-column-start: 1;
    }

    .field textarea {
      width: 100%;
      min-height: 300px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      background: var(--input-bg);
      color: var(--text);
      line-height: 1.5;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .chat {
      overflow-y: auto;
      padding: 22px clamp(14px, 3vw, 34px);
    }

    .chat-inner {
      width: min(940px, 100%);
      margin: 0 auto;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 58vh;
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 22px;
    }

    .message {
      display: grid;
      gap: 8px;
      margin: 0 0 18px;
    }

    .message-head {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .role-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
    }

    .message.assistant .role-dot {
      background: var(--assistant-dot);
    }

    .message-content {
      width: fit-content;
      max-width: min(860px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px 15px;
      background: var(--panel);
      box-shadow: var(--shadow);
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .message.user {
      justify-items: end;
    }

    .message.user .message-head {
      flex-direction: row-reverse;
    }

    .message-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .message:hover .message-actions,
    .message:focus-within .message-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .message-action {
      height: 26px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 12px;
      background: var(--message-action-bg);
    }

    .message-action.danger {
      color: var(--danger);
    }

    .message-action:disabled {
      opacity: 0.45;
    }

    .message.user .message-content {
      background: var(--user-message-bg);
      border-color: var(--user-message-border);
    }

    .message.error .role-dot {
      background: var(--danger);
    }

    .message.error .message-content {
      background: var(--error-message-bg);
      border-color: var(--error-message-border);
      color: var(--error-message-text);
    }

    .edit-box {
      display: grid;
      gap: 8px;
      width: min(720px, 100%);
    }

    .edit-textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      color: var(--text);
      background: var(--input-bg);
      line-height: 1.5;
      outline: none;
    }

    .edit-textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .edit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .edit-save {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .edit-save:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    .markdown > :first-child {
      margin-top: 0;
    }

    .markdown > :last-child {
      margin-bottom: 0;
    }

    .markdown pre {
      max-width: 100%;
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--code-border);
      background: var(--code-bg);
    }

    .markdown pre code {
      display: block;
      padding: 13px;
      line-height: 1.55;
      white-space: pre;
    }

    .markdown code:not(pre code) {
      padding: 2px 5px;
      border-radius: 5px;
      background: var(--inline-code-bg);
      font-size: 0.92em;
    }

    .markdown blockquote {
      margin: 10px 0;
      padding-left: 12px;
      border-left: 3px solid var(--quote-border);
      color: var(--quote-text);
    }

    .markdown table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
    }

    .markdown th,
    .markdown td {
      border: 1px solid var(--line);
      padding: 6px 8px;
    }

    .message-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .message-images img {
      width: 132px;
      height: 96px;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--image-bg);
    }

    .composer-wrap {
      border-top: 1px solid var(--line);
      background: var(--composer-wrap-bg);
      backdrop-filter: blur(10px);
      padding: 14px clamp(14px, 3vw, 34px);
    }

    .composer {
      width: min(940px, 100%);
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .composer.dragging {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--drag-ring), var(--shadow);
    }

    .composer-tools {
      display: flex;
      gap: 8px;
      padding: 8px 10px 0;
    }

    .composer-tools select {
      height: 26px;
      min-width: 0;
      max-width: 100%;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 0 8px;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 12px;
      outline: none;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .composer-tools select:hover,
    .composer-tools select:focus {
      border-color: var(--control-hover-border);
      background: var(--control-hover-bg);
      color: var(--text);
    }

    .pending {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 10px 0;
    }

    .pending.has-items {
      display: flex;
    }

    .pending-item {
      position: relative;
      display: grid;
      grid-template-columns: 46px minmax(0, 125px) 26px;
      gap: 8px;
      align-items: center;
      min-width: 210px;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px;
      background: var(--panel-soft);
    }

    .pending-item img {
      width: 46px;
      height: 38px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--image-bg);
    }

    .pending-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: var(--muted);
    }

    .remove-pending {
      width: 26px;
      height: 26px;
      padding: 0;
      color: var(--danger);
      background: var(--control-bg);
    }

    .input-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
      padding: 10px;
    }

    .file-button,
    .send-button {
      width: 42px;
      height: 42px;
      display: inline-grid;
      place-items: center;
      padding: 0;
    }

    .send-button {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .send-button:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    #promptInput {
      width: 100%;
      min-height: 42px;
      max-height: 190px;
      resize: none;
      border: 0;
      outline: 0;
      padding: 10px 4px;
      color: var(--text);
      background: transparent;
      line-height: 1.5;
    }

    .hint {
      padding: 0 12px 10px 62px;
      color: var(--muted);
      font-size: 12px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px) {
      .app,
      .app.sidebar-collapsed {
        grid-template-columns: minmax(0, 1fr);
      }

      .sidebar {
        position: fixed;
        z-index: 20;
        inset: 0 auto 0 0;
        width: min(286px, 86vw);
        box-shadow: var(--mobile-sidebar-shadow);
      }

      .sidebar-collapsed .sidebar {
        transform: translateX(-100%);
      }

      .topbar {
        grid-template-columns: auto minmax(0, 1fr) auto auto;
        padding: 10px 12px;
      }

      .config {
        grid-template-columns: minmax(0, 1fr);
        max-height: calc(100vh - 100px);
      }

      .chat {
        padding: 16px 12px;
      }

      .composer-wrap {
        padding: 10px 12px;
      }

      .hint {
        padding-left: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" aria-label="历史会话">
      <div class="sidebar-header">
        <button id="newChatBtn" class="new-chat" type="button">新建对话</button>
        <button id="collapseBtn" class="icon-button" type="button" title="折叠侧边栏" aria-label="折叠侧边栏">
          <span aria-hidden="true">‹</span>
        </button>
      </div>
      <div id="historyList" class="history-list"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="showSidebarBtn" class="icon-button" type="button" title="显示历史" aria-label="显示历史">☰</button>
        <div class="title-block">
          <h1 id="chatTitle" class="app-title">新对话</h1>
          <div id="status" class="status">配置 Base URL、API Key 和模型后开始对话</div>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" title="切换主题" aria-label="切换主题">主题</button>
        <button id="configToggle" class="config-toggle" type="button">配置</button>
        <section id="configPanel" class="config" aria-label="接口配置">
          <div class="field">
            <label for="baseUrl">Base URL</label>
            <input id="baseUrl" type="url" placeholder="https://api.openai.com">
          </div>
          <div class="field">
            <label for="apiKey">API Key</label>
            <div class="secret-row">
              <input id="apiKey" type="password" autocomplete="off" placeholder="sk-...">
              <button id="apiKeyToggle" class="secret-toggle" type="button">显示</button>
            </div>
          </div>
          <div class="field full">
            <label>模型管理（高亮项为全局默认模型）</label>
            <div class="model-manager">
              <div class="model-control">
                <input id="newModelInput" type="text" placeholder="输入模型名称">
                <button id="addModelBtn" type="button">添加</button>
              </div>
              <div class="model-control">
                <select id="defaultModelSelect"></select>
                <button id="deleteModelBtn" class="danger" type="button">删除</button>
              </div>
              <div id="modelTagsDisplay" class="model-tags-display"></div>
            </div>
          </div>
          <div class="field new-row">
            <label for="temperature">temperature（温度）</label>
            <input id="temperature" type="number" min="0" max="2" step="0.1" placeholder="默认">
          </div>
          <div class="field">
            <label for="topP">top_p（核采样）</label>
            <input id="topP" type="number" min="0" max="1" step="0.01" placeholder="默认">
          </div>
          <div class="field">
            <label for="maxTokens">max_tokens</label>
            <input id="maxTokens" type="number" min="1" step="1" placeholder="不限制">
          </div>
          <div class="field">
            <label for="maxCompletionTokens">max_completion_tokens</label>
            <input id="maxCompletionTokens" type="number" min="1" step="1" placeholder="不限制">
          </div>
          <div class="field full">
            <label for="systemPrompt">全局提示词</label>
            <textarea id="systemPrompt" rows="3" placeholder="每次请求时动态作为 system 消息发送，不写入历史会话"></textarea>
          </div>
        </section>
      </header>

      <section id="chat" class="chat" aria-live="polite">
        <div id="chatInner" class="chat-inner"></div>
      </section>

      <section class="composer-wrap">
        <form id="composer" class="composer">
          <div class="composer-tools">
            <select id="chatModelSelect" aria-label="当前对话模型"></select>
            <select id="chatReasoning" aria-label="思考深度">
              <option value="">默认</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
              <option value="none">none</option>
              <option value="minimal">minimal</option>
              <option value="xhigh">xhigh</option>
            </select>
          </div>
          <div id="pending" class="pending"></div>
          <div class="input-row">
            <input id="fileInput" class="sr-only" type="file" accept=".txt,.md,text/plain,text/markdown,image/*" multiple>
            <button id="fileBtn" class="file-button" type="button" title="上传 txt、md 或图片" aria-label="上传文件">＋</button>
            <textarea id="promptInput" rows="1" placeholder="输入消息，或拖拽 txt、md、图片到这里"></textarea>
            <button id="sendBtn" class="send-button" type="submit" title="发送" aria-label="发送">↵</button>
          </div>
          <div class="hint">Enter 发送，Shift + Enter 换行。图片会按 OpenAI Vision content 数组格式发送。</div>
        </form>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
  <script>
    (() => {
      "use strict";

      const DB_NAME = "light_ai_chat_db";
      const DB_VERSION = 1;
      const STORE_NAME = "sessions";
      const CONFIG_KEY = "light_ai_chat_config";
      const THEME_KEY = "light_ai_chat_theme";
      const HIGHLIGHT_LIGHT_THEME = "https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css";
      const HIGHLIGHT_DARK_THEME = "https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css";
      const REASONING_EFFORT_VALUES = ["none", "minimal", "low", "medium", "high", "xhigh"];
      const DEFAULT_SAVED_MODELS = ["gpt-4o-mini", "claude-3-5-sonnet"];

      const app = document.getElementById("app");
      const highlightTheme = document.getElementById("highlightTheme");
      const historyList = document.getElementById("historyList");
      const newChatBtn = document.getElementById("newChatBtn");
      const collapseBtn = document.getElementById("collapseBtn");
      const showSidebarBtn = document.getElementById("showSidebarBtn");
      const themeToggle = document.getElementById("themeToggle");
      const configToggle = document.getElementById("configToggle");
      const configPanel = document.getElementById("configPanel");
      const baseUrlInput = document.getElementById("baseUrl");
      const apiKeyInput = document.getElementById("apiKey");
      const apiKeyToggle = document.getElementById("apiKeyToggle");
      const newModelInput = document.getElementById("newModelInput");
      const addModelBtn = document.getElementById("addModelBtn");
      const defaultModelSelect = document.getElementById("defaultModelSelect");
      const deleteModelBtn = document.getElementById("deleteModelBtn");
      const modelTagsDisplay = document.getElementById("modelTagsDisplay");
      const temperatureInput = document.getElementById("temperature");
      const topPInput = document.getElementById("topP");
      const maxTokensInput = document.getElementById("maxTokens");
      const maxCompletionTokensInput = document.getElementById("maxCompletionTokens");
      const systemPromptInput = document.getElementById("systemPrompt");
      const chatTitle = document.getElementById("chatTitle");
      const statusEl = document.getElementById("status");
      const chat = document.getElementById("chat");
      const chatInner = document.getElementById("chatInner");
      const composer = document.getElementById("composer");
      const chatModelSelect = document.getElementById("chatModelSelect");
      const chatReasoning = document.getElementById("chatReasoning");
      const promptInput = document.getElementById("promptInput");
      const sendBtn = document.getElementById("sendBtn");
      const fileBtn = document.getElementById("fileBtn");
      const fileInput = document.getElementById("fileInput");
      const pendingEl = document.getElementById("pending");

      let db;
      let currentSessionId = createId();
      let currentTitle = "新对话";
      let messages = [];
      let pendingImages = [];
      let savedModels = [];
      let defaultModel = "gpt-4o-mini";
      let isSending = false;
      const systemThemeQuery = window.matchMedia("(prefers-color-scheme: dark)");

      marked.setOptions({
        gfm: true,
        breaks: true
      });

      init().catch((error) => {
        console.error(error);
        setStatus("初始化失败：" + getErrorMessage(error), true);
      });

      async function init() {
        applyInitialTheme();
        loadConfig();
        bindEvents();
        db = await openDb();
        await renderHistory();
        renderMessages();
      }

      function bindEvents() {
        newChatBtn.addEventListener("click", startNewChat);
        collapseBtn.addEventListener("click", () => app.classList.add("sidebar-collapsed"));
        showSidebarBtn.addEventListener("click", () => app.classList.toggle("sidebar-collapsed"));
        themeToggle.addEventListener("click", toggleTheme);
        configToggle.addEventListener("click", () => configPanel.classList.toggle("open"));
        apiKeyToggle.addEventListener("click", toggleApiKeyVisibility);
        addModelBtn.addEventListener("click", addSavedModel);
        deleteModelBtn.addEventListener("click", deleteSelectedModel);
        defaultModelSelect.addEventListener("change", updateDefaultModel);
        newModelInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            addSavedModel();
          }
        });
        fileBtn.addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", async () => {
          await handleFiles(fileInput.files);
          fileInput.value = "";
        });

        [
          baseUrlInput,
          apiKeyInput,
          temperatureInput,
          topPInput,
          maxTokensInput,
          maxCompletionTokensInput,
          systemPromptInput
        ].forEach((input) => {
          input.addEventListener("input", saveConfig);
          input.addEventListener("change", saveConfig);
        });

        promptInput.addEventListener("input", autoResizeTextarea);
        promptInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            composer.requestSubmit();
          }
        });

        composer.addEventListener("submit", async (event) => {
          event.preventDefault();
          await sendMessage();
        });

        ["dragenter", "dragover"].forEach((eventName) => {
          composer.addEventListener(eventName, (event) => {
            event.preventDefault();
            composer.classList.add("dragging");
          });
        });

        ["dragleave", "drop"].forEach((eventName) => {
          composer.addEventListener(eventName, (event) => {
            event.preventDefault();
            if (eventName === "drop") {
              handleFiles(event.dataTransfer.files);
            }
            composer.classList.remove("dragging");
          });
        });

        const handleSystemThemeChange = () => {
          if (!getStoredTheme()) {
            applyTheme(getSystemTheme(), false);
          }
        };

        if (systemThemeQuery.addEventListener) {
          systemThemeQuery.addEventListener("change", handleSystemThemeChange);
        } else if (systemThemeQuery.addListener) {
          systemThemeQuery.addListener(handleSystemThemeChange);
        }

        document.addEventListener("click", (event) => {
          const activeItem = event.target.closest ? event.target.closest(".history-item") : null;
          document.querySelectorAll(".history-actions.show-confirm").forEach((actions) => {
            if (!activeItem || !actions.closest(".history-item").contains(activeItem)) {
              actions.classList.remove("show-confirm");
            }
          });

        });
      }

      function applyInitialTheme() {
        const storedTheme = getStoredTheme();
        applyTheme(storedTheme || getSystemTheme(), false);
      }

      function toggleTheme() {
        const currentTheme = document.documentElement.dataset.theme || getSystemTheme();
        const nextTheme = currentTheme === "dark" ? "light" : "dark";
        applyTheme(nextTheme, true);
      }

      function applyTheme(theme, persist) {
        const normalizedTheme = theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = normalizedTheme;
        highlightTheme.href = normalizedTheme === "dark" ? HIGHLIGHT_DARK_THEME : HIGHLIGHT_LIGHT_THEME;
        themeToggle.textContent = normalizedTheme === "dark" ? "深色" : "浅色";
        themeToggle.title = "切换主题，当前为" + (normalizedTheme === "dark" ? "深色" : "浅色");

        if (persist) {
          localStorage.setItem(THEME_KEY, normalizedTheme);
        }
      }

      function getStoredTheme() {
        const value = localStorage.getItem(THEME_KEY);
        return value === "dark" || value === "light" ? value : "";
      }

      function getSystemTheme() {
        return systemThemeQuery.matches ? "dark" : "light";
      }

      function loadConfig() {
        try {
          const saved = JSON.parse(localStorage.getItem(CONFIG_KEY) || "{}");
          baseUrlInput.value = saved.baseUrl || "https://api.openai.com";
          apiKeyInput.value = saved.apiKey || "";
          temperatureInput.value = saved.temperature || "";
          topPInput.value = saved.topP || "";
          maxTokensInput.value = saved.maxTokens || "";
          maxCompletionTokensInput.value = saved.maxCompletionTokens || "";
          savedModels = normalizeSavedModels(saved.savedModels, saved.model);
          defaultModel = normalizeDefaultModel(saved.defaultModel || saved.model, savedModels);
          renderModels();
          resetChatControls();
          systemPromptInput.value = saved.systemPrompt || "";
        } catch {
          baseUrlInput.value = "https://api.openai.com";
          temperatureInput.value = "";
          topPInput.value = "";
          maxTokensInput.value = "";
          maxCompletionTokensInput.value = "";
          savedModels = normalizeSavedModels();
          defaultModel = normalizeDefaultModel("", savedModels);
          renderModels();
          resetChatControls();
          systemPromptInput.value = "";
        }
      }

      function saveConfig() {
        const config = {
          baseUrl: baseUrlInput.value.trim(),
          apiKey: apiKeyInput.value.trim(),
          temperature: temperatureInput.value.trim(),
          topP: topPInput.value.trim(),
          maxTokens: maxTokensInput.value.trim(),
          maxCompletionTokens: maxCompletionTokensInput.value.trim(),
          savedModels,
          defaultModel,
          systemPrompt: systemPromptInput.value
        };
        localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
      }

      function normalizeSavedModels(rawModels, legacyModel) {
        const source = Array.isArray(rawModels) ? rawModels : DEFAULT_SAVED_MODELS;
        const seen = new Set();
        const models = source.map((model) => String(model || "").trim());
        const migratedModel = String(legacyModel || "").trim();
        if (migratedModel) {
          models.unshift(migratedModel);
        }

        const normalized = models.filter((model) => {
          if (!model || seen.has(model)) {
            return false;
          }
          seen.add(model);
          return true;
        });
        if (normalized.length || Array.isArray(rawModels)) {
          return normalized;
        }
        return [...DEFAULT_SAVED_MODELS];
      }

      function normalizeDefaultModel(rawDefaultModel, models) {
        const candidate = String(rawDefaultModel || "").trim();
        if (candidate && models.includes(candidate)) {
          return candidate;
        }
        return models[0] || "";
      }

      function renderModels() {
        savedModels = normalizeSavedModels(savedModels);
        defaultModel = normalizeDefaultModel(defaultModel, savedModels);

        const currentChatModel = chatModelSelect.value;
        renderModelOptions(defaultModelSelect, savedModels);
        renderModelOptions(chatModelSelect, savedModels);
        renderModelBadges();

        defaultModelSelect.value = defaultModel;
        chatModelSelect.value = savedModels.includes(currentChatModel) ? currentChatModel : defaultModel;
        deleteModelBtn.disabled = savedModels.length === 0;
      }

      function renderModelOptions(select, models) {
        select.textContent = "";
        models.forEach((model) => {
          const option = document.createElement("option");
          option.value = model;
          option.textContent = model;
          select.appendChild(option);
        });
      }

      function renderModelBadges() {
        modelTagsDisplay.textContent = "";
        savedModels.forEach((model) => {
          const badge = document.createElement("span");
          badge.className = "model-badge" + (model === defaultModel ? " is-default" : "");
          badge.textContent = model;
          modelTagsDisplay.appendChild(badge);
        });
      }

      function addSavedModel() {
        const model = newModelInput.value.trim();
        if (!model) {
          setStatus("请输入模型名称后再添加", true);
          return;
        }
        if (savedModels.includes(model)) {
          setStatus("该模型已在列表中");
          return;
        }

        savedModels.push(model);
        if (!defaultModel) {
          defaultModel = model;
        }
        newModelInput.value = "";
        renderModels();
        saveConfig();
        setStatus("已添加模型：" + model);
      }

      function deleteSelectedModel() {
        const model = defaultModelSelect.value;
        if (!model) {
          return;
        }
        savedModels = savedModels.filter((item) => item !== model);
        defaultModel = savedModels.length
          ? normalizeDefaultModel(defaultModel === model ? "" : defaultModel, savedModels)
          : "";
        renderModels();
        saveConfig();
        setStatus("已删除模型：" + model);
      }

      function updateDefaultModel() {
        defaultModel = normalizeDefaultModel(defaultModelSelect.value, savedModels);
        saveConfig();
        setStatus("默认模型已切换为：" + defaultModel);
      }

      function resetChatControls() {
        chatModelSelect.value = defaultModel;
        chatReasoning.value = "";
      }

      function toggleApiKeyVisibility() {
        const shouldShow = apiKeyInput.type === "password";
        apiKeyInput.type = shouldShow ? "text" : "password";
        apiKeyToggle.textContent = shouldShow ? "隐藏" : "显示";
      }

      function openDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);

          request.onupgradeneeded = () => {
            const database = request.result;
            if (!database.objectStoreNames.contains(STORE_NAME)) {
              const store = database.createObjectStore(STORE_NAME, { keyPath: "id" });
              store.createIndex("updatedAt", "updatedAt", { unique: false });
            }
          };

          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      function tx(mode = "readonly") {
        return db.transaction(STORE_NAME, mode).objectStore(STORE_NAME);
      }

      function idbRequest(request) {
        return new Promise((resolve, reject) => {
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      async function getAllSessions() {
        const sessions = await idbRequest(tx().getAll());
        return sessions.sort((a, b) => b.updatedAt - a.updatedAt);
      }

      async function getSession(id) {
        return idbRequest(tx().get(id));
      }

      async function putSession(session) {
        return idbRequest(tx("readwrite").put(session));
      }

      async function deleteSession(id) {
        return idbRequest(tx("readwrite").delete(id));
      }

      async function saveCurrentSession() {
        if (!messages.length && currentTitle === "新对话") {
          return;
        }

        if (currentTitle === "新对话") {
          currentTitle = makeTitle(messages);
        }

        const session = {
          id: currentSessionId,
          title: currentTitle,
          updatedAt: Date.now(),
          messages
        };

        await putSession(session);
        await renderHistory();
      }

      async function renderHistory() {
        const sessions = await getAllSessions();
        historyList.textContent = "";

        if (!sessions.length) {
          const empty = document.createElement("div");
          empty.className = "history-empty";
          empty.textContent = "暂无历史会话";
          historyList.appendChild(empty);
          return;
        }

        const fragment = document.createDocumentFragment();
        sessions.forEach((session) => {
          const item = document.createElement("div");
          item.className = "history-item" + (session.id === currentSessionId ? " active" : "");
          item.tabIndex = 0;

          const text = document.createElement("div");
          const title = document.createElement("div");
          title.className = "history-title";
          title.textContent = session.title || "未命名会话";

          const time = document.createElement("div");
          time.className = "history-time";
          time.textContent = formatTime(session.updatedAt);

          text.append(title, time);

          const actions = document.createElement("div");
          actions.className = "history-actions";

          const confirmDelete = document.createElement("button");
          confirmDelete.className = "confirm-delete";
          confirmDelete.type = "button";
          confirmDelete.textContent = "确认";
          confirmDelete.title = "确认删除";

          const del = document.createElement("button");
          del.className = "delete-chat";
          del.type = "button";
          del.title = "删除";
          del.setAttribute("aria-label", "删除 " + (session.title || "会话"));
          del.textContent = "×";

          item.addEventListener("click", () => loadSession(session.id));
          item.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              loadSession(session.id);
            }
          });
          del.addEventListener("click", async (event) => {
            event.stopPropagation();
            actions.classList.toggle("show-confirm");
          });
          confirmDelete.addEventListener("click", async (event) => {
            event.stopPropagation();
            await deleteSession(session.id);
            if (session.id === currentSessionId) {
              startNewChat();
            }
            await renderHistory();
          });

          actions.append(confirmDelete, del);
          item.append(text, actions);
          fragment.appendChild(item);
        });

        historyList.appendChild(fragment);
      }

      async function loadSession(id) {
        const session = await getSession(id);
        if (!session) {
          return;
        }

        currentSessionId = session.id;
        currentTitle = session.title || "未命名会话";
        messages = [...(session.messages || [])];
        pendingImages = [];
        promptInput.value = "";
        renderPendingImages();
        renderMessages();
        await renderHistory();
        setStatus("已加载历史会话");

        if (window.matchMedia("(max-width: 760px)").matches) {
          app.classList.add("sidebar-collapsed");
        }
      }

      function startNewChat() {
        currentSessionId = createId();
        currentTitle = "新对话";
        messages = [];
        pendingImages = [];
        promptInput.value = "";
        resetChatControls();
        autoResizeTextarea();
        renderPendingImages();
        renderMessages();
        renderHistory();
        setStatus("已新建对话");
      }

      async function sendMessage() {
        if (isSending) {
          return;
        }

        const text = promptInput.value.trim();
        if (!text && !pendingImages.length) {
          setStatus("请输入文本或上传图片", true);
          return;
        }

        const config = getConfig();
        if (!config.baseUrl || !config.apiKey || !config.model) {
          configPanel.classList.add("open");
          setStatus("请先补全 Base URL、API Key 和模型名称", true);
          return;
        }

        const userMessage = buildUserMessage(text, pendingImages);
        messages.push(userMessage);

        promptInput.value = "";
        pendingImages = [];
        autoResizeTextarea();
        renderPendingImages();
        renderMessages();
        await saveCurrentSession();

        setSending(true);
        setStatus("正在请求模型...");

        try {
          const assistantText = await requestChatCompletion(config);
          messages.push({
            role: "assistant",
            content: assistantText || ""
          });
          renderMessages();
          await saveCurrentSession();
          setStatus("已完成");
        } catch (error) {
          console.error(error);
          const errorText = "请求失败：" + getErrorMessage(error);
          setStatus(errorText, true);
          appendErrorMessage(errorText);
        } finally {
          setSending(false);
        }
      }

      function getConfig() {
        return {
          baseUrl: baseUrlInput.value.trim(),
          apiKey: apiKeyInput.value.trim(),
          model: chatModelSelect.value || defaultModel,
          temperature: temperatureInput.value.trim(),
          topP: topPInput.value.trim(),
          maxTokens: maxTokensInput.value.trim(),
          maxCompletionTokens: maxCompletionTokensInput.value.trim(),
          reasoningEffort: REASONING_EFFORT_VALUES.includes(chatReasoning.value) ? chatReasoning.value : "",
          systemPrompt: systemPromptInput.value
        };
      }

      function buildUserMessage(text, images) {
        if (!images.length) {
          return { role: "user", content: text };
        }

        const content = [];
        if (text) {
          content.push({ type: "text", text });
        }

        images.forEach((image) => {
          content.push({
            type: "image_url",
            image_url: {
              url: image.dataUrl
            }
          });
        });

        return { role: "user", content };
      }

      async function requestChatCompletion(config) {
        const payload = buildRequestPayload(config);
        const data = await fetchJsonWithRetry(makeEndpoint(config.baseUrl), {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + config.apiKey
          },
          body: JSON.stringify(payload)
        }, 3);

        const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
        return normalizeAssistantContent(content);
      }

      function buildRequestPayload(config) {
        const payload = {
          model: config.model,
          messages: buildRequestMessages(config.systemPrompt)
        };

        addOptionalFloat(payload, "temperature", config.temperature, 0, 2);
        addOptionalFloat(payload, "top_p", config.topP, 0, 1);
        addOptionalInteger(payload, "max_tokens", config.maxTokens, 1);
        addOptionalInteger(payload, "max_completion_tokens", config.maxCompletionTokens, 1);

        if (config.reasoningEffort) {
          payload.reasoning_effort = config.reasoningEffort;
        }

        return payload;
      }

      function addOptionalFloat(target, key, rawValue, min, max) {
        if (rawValue === "") {
          return;
        }

        const value = parseFloat(rawValue);
        if (!Number.isFinite(value) || value < min || value > max) {
          return;
        }

        target[key] = value;
      }

      function addOptionalInteger(target, key, rawValue, min) {
        if (rawValue === "") {
          return;
        }

        const value = parseInt(rawValue, 10);
        if (!Number.isFinite(value) || value < min) {
          return;
        }

        target[key] = value;
      }

      async function fetchJsonWithRetry(url, options, maxRetries) {
        let lastError;

        for (let attempt = 0; attempt <= maxRetries; attempt += 1) {
          try {
            const response = await fetch(url, options);
            const data = await parseResponseJson(response);

            if (response.ok) {
              return data;
            }

            const httpError = makeHttpError(response, data);
            if (shouldRetryStatus(response.status) && attempt < maxRetries) {
              lastError = httpError;
              await waitBeforeRetry(attempt + 1);
              continue;
            }

            throw httpError;
          } catch (error) {
            if (error.status) {
              throw error;
            }

            lastError = new Error("网络异常：" + getErrorMessage(error));
            if (attempt < maxRetries) {
              await waitBeforeRetry(attempt + 1);
              continue;
            }

            throw lastError;
          }
        }

        throw lastError || new Error("请求失败");
      }

      async function parseResponseJson(response) {
        const text = await response.text();
        try {
          return text ? JSON.parse(text) : {};
        } catch {
          return { raw: text };
        }
      }

      function buildRequestMessages(systemPrompt) {
        const requestMessages = [...messages];
        const prompt = (systemPrompt || "").trim();
        if (prompt) {
          requestMessages.unshift({
            role: "system",
            content: prompt
          });
        }
        return requestMessages;
      }

      function makeHttpError(response, data) {
        const detail = getApiErrorDetail(data) || response.status + " " + response.statusText;
        const error = new Error("HTTP " + response.status + "：" + detail);
        error.status = response.status;
        return error;
      }

      function getApiErrorDetail(data) {
        if (!data) {
          return "";
        }
        if (data.error && data.error.message) {
          return data.error.message;
        }
        if (data.message) {
          return data.message;
        }
        if (data.raw) {
          return data.raw;
        }
        return "";
      }

      function shouldRetryStatus(status) {
        return status >= 500 && status <= 599;
      }

      async function waitBeforeRetry(retryNumber) {
        const delayMs = retryNumber * 1000;
        setStatus("请求失败，" + delayMs / 1000 + " 秒后进行第 " + retryNumber + " 次重试...");
        await delay(delayMs);
        setStatus("正在进行第 " + retryNumber + " 次重试...");
      }

      function delay(ms) {
        return new Promise((resolve) => {
          setTimeout(resolve, ms);
        });
      }

      function makeEndpoint(baseUrl) {
        const clean = baseUrl.replace(/\/+$/, "");
        if (/\/v1\/chat\/completions$/.test(clean)) {
          return clean;
        }
        if (/\/v1$/.test(clean)) {
          return clean + "/chat/completions";
        }
        return clean + "/v1/chat/completions";
      }

      function normalizeAssistantContent(content) {
        if (Array.isArray(content)) {
          return content.map((part) => {
            if (typeof part === "string") {
              return part;
            }
            return part.text || "";
          }).join("");
        }
        return typeof content === "string" ? content : "";
      }

      async function handleFiles(fileList) {
        const files = Array.from(fileList || []);
        if (!files.length) {
          return;
        }

        for (const file of files) {
          if (isTextFile(file)) {
            const text = await readAsText(file);
            appendToPrompt(formatFileText(file.name, text));
          } else if (file.type.startsWith("image/")) {
            const dataUrl = await readAsDataUrl(file);
            pendingImages.push({
              id: createId(),
              name: file.name,
              dataUrl
            });
          } else {
            setStatus("已跳过不支持的文件：" + file.name, true);
          }
        }

        renderPendingImages();
        autoResizeTextarea();
      }

      function isTextFile(file) {
        const name = file.name.toLowerCase();
        return file.type.startsWith("text/") || name.endsWith(".txt") || name.endsWith(".md");
      }

      function readAsText(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(reader.error);
          reader.readAsText(file);
        });
      }

      function readAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(file);
        });
      }

      function formatFileText(name, text) {
        return "\n\n--- " + name + " ---\n" + text.trim();
      }

      function appendToPrompt(text) {
        const current = promptInput.value.trimEnd();
        promptInput.value = current ? current + text : text.trimStart();
      }

      function renderPendingImages() {
        pendingEl.textContent = "";
        pendingEl.classList.toggle("has-items", pendingImages.length > 0);

        pendingImages.forEach((image) => {
          const item = document.createElement("div");
          item.className = "pending-item";

          const img = document.createElement("img");
          img.src = image.dataUrl;
          img.alt = image.name;

          const name = document.createElement("div");
          name.className = "pending-name";
          name.textContent = image.name;

          const remove = document.createElement("button");
          remove.className = "remove-pending";
          remove.type = "button";
          remove.title = "移除图片";
          remove.setAttribute("aria-label", "移除 " + image.name);
          remove.textContent = "×";
          remove.addEventListener("click", () => {
            pendingImages = pendingImages.filter((itemImage) => itemImage.id !== image.id);
            renderPendingImages();
          });

          item.append(img, name, remove);
          pendingEl.appendChild(item);
        });
      }

      function renderMessages() {
        chatTitle.textContent = currentTitle;
        chatInner.textContent = "";

        if (!messages.length) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.innerHTML = "<div><strong>轻量 AI 对话</strong><span>历史保存在本机 IndexedDB，配置保存在 localStorage。</span></div>";
          chatInner.appendChild(empty);
          return;
        }

        const fragment = document.createDocumentFragment();
        messages.forEach((message, index) => {
          fragment.appendChild(renderMessage(message, index));
        });
        chatInner.appendChild(fragment);
        highlightCode(chatInner);
        chat.scrollTop = chat.scrollHeight;
      }

      function renderMessage(message, index) {
        const wrapper = document.createElement("article");
        wrapper.className = "message " + message.role;

        const head = document.createElement("div");
        head.className = "message-head";

        const dot = document.createElement("span");
        dot.className = "role-dot";

        const role = document.createElement("span");
        role.textContent = message.role === "assistant" ? "AI" : "你";

        const actions = document.createElement("div");
        actions.className = "message-actions";

        const editBtn = document.createElement("button");
        editBtn.className = "message-action";
        editBtn.type = "button";
        editBtn.textContent = "编辑";
        editBtn.disabled = isSending;
        editBtn.addEventListener("click", () => startEditMessage(wrapper, message, index));

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "message-action danger";
        deleteBtn.type = "button";
        deleteBtn.textContent = "删除";
        deleteBtn.disabled = isSending;
        deleteBtn.addEventListener("click", () => deleteMessage(index));

        actions.append(editBtn, deleteBtn);
        head.append(dot, role, actions);

        const content = document.createElement("div");
        content.className = "message-content";

        const parsed = parseMessageContent(message.content);
        const markdown = document.createElement("div");
        markdown.className = "markdown";
        markdown.innerHTML = sanitizeHtml(marked.parse(parsed.text || ""));
        content.appendChild(markdown);

        if (parsed.images.length) {
          const images = document.createElement("div");
          images.className = "message-images";
          parsed.images.forEach((src) => {
            const img = document.createElement("img");
            img.src = src;
            img.alt = "上传图片";
            images.appendChild(img);
          });
          content.appendChild(images);
        }

        wrapper.append(head, content);
        return wrapper;
      }

      async function deleteMessage(index) {
        if (isSending) {
          setStatus("请求进行中，暂不能修改历史消息", true);
          return;
        }
        if (!Number.isInteger(index) || index < 0 || index >= messages.length) {
          return;
        }
        if (!confirm("删除这条消息？")) {
          return;
        }

        messages.splice(index, 1);
        await saveCurrentSession();
        renderMessages();
        setStatus("消息已删除");
      }

      function startEditMessage(wrapper, message, index) {
        if (isSending) {
          setStatus("请求进行中，暂不能修改历史消息", true);
          return;
        }
        if (!Number.isInteger(index) || index < 0 || index >= messages.length) {
          return;
        }

        const oldContent = wrapper.querySelector(".message-content");
        if (!oldContent) {
          return;
        }

        const parsed = parseMessageContent(message.content);
        const editContent = document.createElement("div");
        editContent.className = "message-content";

        const box = document.createElement("div");
        box.className = "edit-box";

        const textarea = document.createElement("textarea");
        textarea.className = "edit-textarea";
        textarea.value = parsed.text;

        const actions = document.createElement("div");
        actions.className = "edit-actions";

        const cancelBtn = document.createElement("button");
        cancelBtn.type = "button";
        cancelBtn.textContent = "取消";
        cancelBtn.addEventListener("click", renderMessages);

        const saveBtn = document.createElement("button");
        saveBtn.type = "button";
        saveBtn.className = "edit-save";
        saveBtn.textContent = "保存";
        saveBtn.addEventListener("click", async () => {
          updateMessageText(index, textarea.value);
          await saveCurrentSession();
          renderMessages();
          setStatus("消息已更新");
        });

        actions.append(cancelBtn, saveBtn);
        box.append(textarea, actions);
        editContent.appendChild(box);
        oldContent.replaceWith(editContent);
        textarea.focus();
      }

      function updateMessageText(index, text) {
        const message = messages[index];
        if (!message) {
          return;
        }

        if (Array.isArray(message.content)) {
          const preservedParts = message.content.filter((part) => part && part.type !== "text");
          message.content = text ? [{ type: "text", text }, ...preservedParts] : preservedParts;
          return;
        }

        message.content = text;
      }

      function appendErrorMessage(text) {
        const wrapper = document.createElement("article");
        wrapper.className = "message assistant error";

        const head = document.createElement("div");
        head.className = "message-head";

        const dot = document.createElement("span");
        dot.className = "role-dot";

        const role = document.createElement("span");
        role.textContent = "错误";
        head.append(dot, role);

        const content = document.createElement("div");
        content.className = "message-content";
        content.textContent = text;

        wrapper.append(head, content);
        chatInner.appendChild(wrapper);
        chat.scrollTop = chat.scrollHeight;
      }

      function parseMessageContent(content) {
        if (typeof content === "string") {
          return { text: content, images: [] };
        }

        if (!Array.isArray(content)) {
          return { text: "", images: [] };
        }

        return content.reduce((acc, part) => {
          if (!part) {
            return acc;
          }
          if (part.type === "text") {
            acc.text += (acc.text ? "\n\n" : "") + (part.text || "");
          }
          if (part.type === "image_url" && part.image_url && part.image_url.url) {
            acc.images.push(part.image_url.url);
          }
          return acc;
        }, { text: "", images: [] });
      }

      function sanitizeHtml(html) {
        const template = document.createElement("template");
        template.innerHTML = html;
        const blocked = template.content.querySelectorAll("script, iframe, object, embed, link, meta, style");
        blocked.forEach((node) => node.remove());

        template.content.querySelectorAll("*").forEach((node) => {
          Array.from(node.attributes).forEach((attribute) => {
            const name = attribute.name.toLowerCase();
            const value = attribute.value.trim().toLowerCase();
            if (name.startsWith("on") || value.startsWith("javascript:")) {
              node.removeAttribute(attribute.name);
            }
          });
        });

        return template.innerHTML;
      }

      function highlightCode(root) {
        root.querySelectorAll("pre code").forEach((block) => {
          hljs.highlightElement(block);
        });
      }

      function makeTitle(messageList) {
        const firstUser = messageList.find((message) => message.role === "user");
        const text = firstUser ? parseMessageContent(firstUser.content).text : "";
        const compact = text.replace(/\s+/g, " ").trim();
        return compact ? compact.slice(0, 15) : "图片对话";
      }

      function createId() {
        if (window.crypto && window.crypto.randomUUID) {
          return window.crypto.randomUUID();
        }
        return "chat_" + Date.now() + "_" + Math.random().toString(16).slice(2);
      }

      function formatTime(timestamp) {
        if (!timestamp) {
          return "";
        }
        return new Intl.DateTimeFormat("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(new Date(timestamp));
      }

      function autoResizeTextarea() {
        promptInput.style.height = "auto";
        promptInput.style.height = Math.min(promptInput.scrollHeight, 190) + "px";
      }

      function setSending(sending) {
        isSending = sending;
        sendBtn.disabled = sending;
        promptInput.disabled = sending;
        fileBtn.disabled = sending;
        document.querySelectorAll(".message-action").forEach((button) => {
          button.disabled = sending;
        });
      }

      function setStatus(text, isError = false) {
        statusEl.textContent = text;
        statusEl.style.color = isError ? "var(--danger)" : "var(--muted)";
      }

      function getErrorMessage(error) {
        return error && error.message ? error.message : String(error);
      }
    })();
  </script>
</body>
</html>
